rules:
  - id: securepr-hardcoded-password
    languages: [generic]
    message: Hard-coded password or credential value detected; use an approved secret-management mechanism instead.
    severity: ERROR
    patterns:
      - pattern-regex: |
          (?i)\b(password|passwd|pwd|secret|api[_-]?key|access[_-]?key|token)\s*[:=]\s*["'][^"'\n]{8,}["']
    paths:
      exclude:
        - tests/**
        - docs/**
        - .venv/**
        - node_modules/**
  - id: securepr-hardcoded-privileged-username
    languages: [generic]
    message: Hard-coded privileged username detected; review whether privileged identity data belongs in source code.
    severity: ERROR
    patterns:
      - pattern-regex: |
          (?i)\b(username|user_name|login)\s*[:=]\s*["'](admin|administrator|root|superuser)["']
    paths:
      exclude:
        - tests/**
        - docs/**
        - .venv/**
        - node_modules/**
  - id: securepr-unsafe-eval
    languages: [generic]
    message: Dynamic code evaluation detected; avoid eval-like execution of untrusted input.
    severity: ERROR
    patterns:
      - pattern-regex: |
          \b(eval|exec)\s*\(
    paths:
      exclude:
        - tests/**
        - docs/**
        - .venv/**
        - node_modules/**
  - id: securepr-unverified-tls-python
    languages: [generic]
    message: TLS certificate verification is explicitly disabled; verify certificates unless a narrowly justified test-only exception applies.
    severity: ERROR
    patterns:
      - pattern-regex: |
          (?i)\bverify\s*=\s*False\b
    paths:
      exclude:
        - tests/**
        - docs/**
        - .venv/**
        - node_modules/**
