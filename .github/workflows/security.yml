name: SecurePR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: securepr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  security-gate:
    name: SecurePR Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect repository profile
        id: profile
        run: python -m scripts.repository_profile

      - name: Python runtime policy
        id: python-runtime
        continue-on-error: true
        run: python -m scripts.check_python_version

      - name: Install project dependencies
        id: install
        continue-on-error: true
        run: python -m pip install -r requirements.txt

      - name: Security tests and correctness checks
        id: security-tests
        continue-on-error: true
        run: |
          python -m pytest -q
          python -m compileall -q app security tests scripts

      - name: Secret detection
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Semgrep SAST
        id: semgrep
        continue-on-error: true
        run: |
          python -m pip install semgrep
          semgrep scan --sarif --output semgrep-results.sarif --config p/python --config p/security-audit --config .semgrep_securepr.yml --error --exclude tests --exclude docs

      - name: Dependency audit
        id: dependency-audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: CodeQL initialization
        id: codeql
        if: steps.profile.outputs.codeql_languages != ''
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.profile.outputs.codeql_languages }}
          queries: security-extended

      - name: CodeQL analysis
        id: codeql-analyze
        if: steps.profile.outputs.codeql_languages != ''
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:multi
          output: codeql-results

      - name: Normalize SAST findings
        id: finding-summary
        if: always()
        continue-on-error: true
        run: |
          python scripts/summarize_sarif.py .
          if [[ -f securepr-findings.md ]]; then
            cat securepr-findings.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish SecurePR result
        id: result
        if: always()
        env:
          PYTHON_RUNTIME_RESULT: ${{ steps.python-runtime.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TEST_RESULT: ${{ steps.security-tests.outcome }}
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependency-audit.outcome }}
          CODEQL_INIT_RESULT: ${{ steps.codeql.outcome }}
          CODEQL_ANALYZE_RESULT: ${{ steps.codeql-analyze.outcome }}
          FINDING_SUMMARY_RESULT: ${{ steps.finding-summary.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result() {
            if [[ "$1" == "success" ]]; then echo "🟢 PASS"; else echo "🔴 BLOCK"; fi
          }

          overall="PASS"
          if [[ "$PYTHON_RUNTIME_RESULT" != "success" ||
                "$INSTALL_RESULT" != "success" ||
                "$TEST_RESULT" != "success" ||
                "$GITLEAKS_RESULT" != "success" ||
                "$SEMGREP_RESULT" != "success" ||
                "$DEPENDENCY_RESULT" != "success" ||
                "$CODEQL_INIT_RESULT" == "failure" ||
                "$CODEQL_ANALYZE_RESULT" == "failure" ||
                "$FINDING_SUMMARY_RESULT" != "success" ]]; then
            overall="BLOCK"
          fi

          if [[ "$overall" == "PASS" ]]; then
            echo "## 🟢 SecurePR: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "All configured automated SecurePR controls passed. Human review is always recommended before merge." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔴 SecurePR: BLOCK" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more required SecurePR controls failed. Remediate the blocking result and rerun the gate. Human review is always recommended." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result | What it checks |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository profile | PASS | Languages, manifests, and CodeQL applicability |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python runtime policy | $(result "$PYTHON_RUNTIME_RESULT") | Supported Python runtime policy |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency install | $(result "$INSTALL_RESULT") | Reproducible project dependency installation |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security tests | $(result "$TEST_RESULT") | Security behavior and correctness/compilation checks |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret detection | $(result "$GITLEAKS_RESULT") | Credential and secret material |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep SAST | $(result "$SEMGREP_RESULT") | Rule-based security patterns |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | $(result "$DEPENDENCY_RESULT") | Known vulnerable Python dependencies |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | $(result "$CODEQL_ANALYZE_RESULT") | Semantic multi-language security analysis |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Normalized findings | $(result "$FINDING_SUMMARY_RESULT") | De-duplicated SARIF findings from SAST controls |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Fixes to make this PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          blockers=0

          blocker() {
            blockers=$((blockers + 1))
            echo "#### 🔴 $1" >> "$GITHUB_STEP_SUMMARY"
            echo "**Why it failed:** $2" >> "$GITHUB_STEP_SUMMARY"
            echo "**Why it matters:** $3" >> "$GITHUB_STEP_SUMMARY"
            echo "**What to fix:** $4" >> "$GITHUB_STEP_SUMMARY"
            echo "**Expected result:** $5" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          [[ "$PYTHON_RUNTIME_RESULT" == "success" ]] || blocker "Python runtime policy" "The repository is outside the supported Python runtime policy." "Unsupported runtimes may lack security support or tested compatibility." "Update the runtime declaration to Python 3.11 or newer." "The runtime policy reports PASS."
          [[ "$INSTALL_RESULT" == "success" ]] || blocker "Dependency installation" "Project dependencies could not be installed reproducibly." "Downstream security and correctness checks cannot be trusted if dependencies cannot be reproduced." "Fix package names or version constraints and rerun the installation." "CI installs the declared dependencies successfully."
          [[ "$TEST_RESULT" == "success" ]] || blocker "Security tests" "A security test or compilation check failed." "The change may break expected security behavior or correctness." "Fix the failing test or compile error and rerun the gate." "All required tests and compilation checks pass."
          [[ "$GITLEAKS_RESULT" == "success" ]] || blocker "Secret detection" "Gitleaks detected credential-like material." "Committed credentials can enable unauthorized access and remain exposed in repository history." "Remove the secret, rotate any real credential, and use approved secret management. Do not merely suppress the finding." "Secret detection passes."
          [[ "$SEMGREP_RESULT" == "success" ]] || blocker "Semgrep SAST" "Semgrep reported a blocking security pattern or could not complete." "The pattern may represent an exploitable unsafe construct or incomplete analysis." "Inspect the rule and remediate the underlying code; only suppress a demonstrable false positive under project policy." "Semgrep completes without a blocking result."
          [[ "$DEPENDENCY_RESULT" == "success" ]] || blocker "Dependency audit" "A known vulnerable dependency was reported or the audit failed." "Vulnerable dependencies can introduce risk independently of application source code." "Upgrade, replace, or otherwise remediate the affected dependency." "The dependency audit passes."
          if [[ "$CODEQL_INIT_RESULT" == "failure" || "$CODEQL_ANALYZE_RESULT" == "failure" ]]; then
            blocker "CodeQL" "CodeQL initialization or analysis failed." "An incomplete semantic analysis leaves intended code coverage unverified." "Fix the CodeQL configuration, build, or analysis problem and rerun the gate." "CodeQL completes successfully."
          fi
          [[ "$FINDING_SUMMARY_RESULT" == "success" ]] || blocker "Normalized SAST findings" "One or more unique SARIF findings were reported." "A normalized finding represents a security result that must be reviewed and remediated before merge." "Use the normalized finding table and underlying tool logs to fix the source issue; do not blindly suppress duplicate reports." "No blocking normalized SAST findings remain."

          if [[ "$blockers" -eq 0 ]]; then
            echo "No blocking fixes are required for this run. Human review is always recommended, including review of security design, business logic, authorization intent, configuration, and tool coverage." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Remediation" >> "$GITHUB_STEP_SUMMARY"
          echo "SecurePR never automatically edits source code, rotates credentials, or merges a pull request. Review the finding, apply the fix, push the change, and rerun SecurePR. Human review is always recommended after automated remediation or a PASS." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Accuracy boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "SecurePR does not claim 100% detection accuracy. False positives and false negatives remain possible, especially for runtime behavior, business logic, architecture, configuration, and unsupported language/tool coverage. Phase 4 defines a controlled benchmark for measuring TP, FP, TN, FN, precision, recall, and F1 at final validation." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the full Actions run]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$overall" != "PASS" ]]; then exit 1; fi
