name: SecurePR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One workflow job keeps the PR check surface simple. Individual security
# checks still run as separate steps so their logs remain easy to inspect.
concurrency:
  group: securepr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  security-gate:
    name: SecurePR Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Python runtime policy
        id: python-runtime
        continue-on-error: true
        run: python scripts/check_python_version.py

      - name: Install project dependencies
        id: install
        continue-on-error: true
        run: python -m pip install -r requirements.txt

      - name: Security tests
        id: security-tests
        continue-on-error: true
        run: |
          python -m pytest -q
          python -m compileall -q app security tests

      - name: Secret detection
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Semgrep SAST
        id: semgrep
        continue-on-error: true
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --config p/security-audit --error --exclude tests

      - name: Dependency audit
        id: dependency-audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: CodeQL analysis
        id: codeql
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        id: codeql-analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4

      - name: Publish SecurePR result
        id: result
        if: always()
        env:
          PYTHON_RUNTIME_RESULT: ${{ steps.python-runtime.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TEST_RESULT: ${{ steps.security-tests.outcome }}
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependency-audit.outcome }}
          CODEQL_INIT_RESULT: ${{ steps.codeql.outcome }}
          CODEQL_ANALYZE_RESULT: ${{ steps.codeql-analyze.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result() {
            if [[ "$1" == "success" ]]; then
              echo "🟢 PASS"
            else
              echo "🔴 BLOCK"
            fi
          }

          overall="PASS"
          if [[ "$PYTHON_RUNTIME_RESULT" != "success" ||
                "$INSTALL_RESULT" != "success" ||
                "$TEST_RESULT" != "success" ||
                "$GITLEAKS_RESULT" != "success" ||
                "$SEMGREP_RESULT" != "success" ||
                "$DEPENDENCY_RESULT" != "success" ||
                "$CODEQL_INIT_RESULT" != "success" ||
                "$CODEQL_ANALYZE_RESULT" != "success" ]]; then
            overall="BLOCK"
          fi

          if [[ "$overall" == "PASS" ]]; then
            echo "## 🟢 SecurePR: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "The required automated security checks completed successfully. No blocking finding was reported by SecurePR. Human review is still required before merging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔴 SecurePR: BLOCK" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more required checks did not pass. Review the failed check before merging; SecurePR does not merge or modify the PR automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result | What it checks |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python runtime policy | $(result "$PYTHON_RUNTIME_RESULT") | Rejects unsupported Python runtimes and provides upgrade guidance |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency install | $(result "$INSTALL_RESULT") | Project dependencies can be installed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security tests | $(result "$TEST_RESULT") | Expected security behavior and Python compilation |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret detection | $(result "$GITLEAKS_RESULT") | Committed API keys, tokens, passwords, and other secret patterns |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep SAST | $(result "$SEMGREP_RESULT") | Source-code security patterns and unsafe constructs |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | $(result "$DEPENDENCY_RESULT") | Known vulnerabilities in Python dependencies |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | $(result "$CODEQL_ANALYZE_RESULT") | Semantic source-code security analysis |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the full Actions run]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Remediation" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$overall" == "PASS" ]]; then
            echo "No automated remediation is required. If a finding is reported later, fix the code or dependency in the PR, push the change, and let SecurePR re-run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SecurePR reports the failed control; it does not silently edit source code. Apply the recommended fix in the PR, push the change, and re-run the gate. This keeps false-positive decisions and code changes under human control." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$overall" != "PASS" ]]; then
            exit 1
          fi
