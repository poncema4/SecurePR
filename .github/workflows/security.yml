name: SecurePR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: securepr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  securepr:
    uses: ./.github/workflows/reusable-security.yml
    with:
      tooling-repository: poncema4/SecurePR
      tooling-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      python-version: "3.12"
      run_project_tests: true
