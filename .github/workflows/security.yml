name: SecurePR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: securepr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  security-gate:
    name: SecurePR Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout SecurePR tooling at PR commit
        uses: actions/checkout@v6
        with:
          repository: poncema4/SecurePR
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .securepr-tooling
          sparse-checkout: |
            scripts/check_python_version.py
            scripts/accuracy_report.py
            scripts/accuracy_metrics.py
            scripts/repository_profile.py
            scripts/summarize_sarif.py
            .semgrep_securepr.yml
            docs/accuracy/benchmark-results.csv

      - name: Set up Python for SecurePR tooling
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Python runtime policy
        id: python-runtime
        if: always() && (hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != '' || hashFiles('.python-version') != '')
        run: python .securepr-tooling/scripts/check_python_version.py

      - name: Detect repository profile
        id: profile
        if: always()
        run: python .securepr-tooling/scripts/repository_profile.py

      - name: Install Python project dependencies
        id: python-install
        if: always() && hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt

      - name: Python project tests
        id: python-tests
        if: always() && hashFiles('requirements.txt') != '' && hashFiles('tests/**/*.py') != ''
        run: |
          python -m pytest -q
          python -m compileall -q app security tests scripts

      - name: JavaScript or TypeScript tests
        id: node-tests
        if: always() && hashFiles('package.json') != ''
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
          npm test --if-present
          npm run typecheck --if-present

      - name: Dependency audit
        id: dependency-audit
        if: always()
        run: |
          found=0
          if [[ -f requirements.txt ]]; then
            found=1
            python -m pip install pip-audit
            pip-audit -r requirements.txt
          fi
          if [[ -f package-lock.json ]]; then
            found=1
            npm audit --package-lock-only --audit-level=high
          fi
          if [[ "$found" -eq 0 ]]; then
            echo "No currently supported dependency manifest was found; dependency audit is not applicable."
          fi

      - name: Secret detection
        id: gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Semgrep SAST
        id: semgrep
        if: always()
        run: |
          python -m pip install semgrep
          semgrep scan --sarif --output semgrep-results.sarif --config p/security-audit --config .securepr-tooling/.semgrep_securepr.yml --error --exclude tests --exclude docs --exclude .securepr-tooling

      - name: CodeQL initialization
        id: codeql-init
        if: always() && steps.profile.outputs.codeql_languages != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.profile.outputs.codeql_languages }}
          queries: security-extended

      - name: CodeQL analysis
        id: codeql-analyze
        if: always() && steps.profile.outputs.codeql_languages != ''
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:multi
          output: codeql-results

      - name: Build consolidated finding evidence
        id: finding-summary
        if: always()
        run: |
          python .securepr-tooling/scripts/summarize_sarif.py .
          if [[ -f securepr-findings.md ]]; then cat securepr-findings.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Accuracy status
        id: accuracy
        if: always()
        run: |
          python .securepr-tooling/scripts/accuracy_report.py > securepr-accuracy.md
          cat securepr-accuracy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish SecurePR result
        id: result
        if: always()
        env:
          PYTHON_RUNTIME_RESULT: ${{ steps.python-runtime.outcome }}
          PROFILE_RESULT: ${{ steps.profile.outcome }}
          INSTALL_RESULT: ${{ steps.python-install.outcome }}
          TEST_RESULT: ${{ steps.python-tests.outcome }}
          NODE_TEST_RESULT: ${{ steps.node-tests.outcome }}
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep.outcome }}
          DEPENDENCY_RESULT: ${{ steps.dependency-audit.outcome }}
          CODEQL_INIT_RESULT: ${{ steps.codeql-init.outcome }}
          CODEQL_ANALYZE_RESULT: ${{ steps.codeql-analyze.outcome }}
          FINDING_SUMMARY_RESULT: ${{ steps.finding-summary.outcome }}
          ACCURACY_RESULT: ${{ steps.accuracy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set +e
          result() { [[ "$1" == "success" || "$1" == "skipped" ]] && echo "🟢 PASS" || echo "🔴 BLOCK"; }
          overall="PASS"
          for value in "$PYTHON_RUNTIME_RESULT" "$PROFILE_RESULT" "$INSTALL_RESULT" "$TEST_RESULT" "$NODE_TEST_RESULT" "$GITLEAKS_RESULT" "$SEMGREP_RESULT" "$DEPENDENCY_RESULT" "$CODEQL_INIT_RESULT" "$CODEQL_ANALYZE_RESULT" "$FINDING_SUMMARY_RESULT" "$ACCURACY_RESULT"; do
            [[ "$value" == "failure" ]] && overall="BLOCK"
          done

          if [[ "$overall" == "PASS" ]]; then
            echo "## 🟢 SecurePR: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "All required SecurePR controls completed successfully. Human review is still required before merge." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔴 SecurePR: BLOCK" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more required SecurePR controls did not pass. Fix the blocking result on this same PR/branch and rerun the gate. Human review is always recommended." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result | What it checks | Why it matters |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python runtime policy | $(result "$PYTHON_RUNTIME_RESULT") | Supported Python runtime declaration | Keeps analysis inside a supported security/test environment |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository profile | $(result "$PROFILE_RESULT") | Detects CodeQL languages and dependency manifests | Prevents silent single-language assumptions |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency install | $(result "$INSTALL_RESULT") | Reproduces Python dependencies when applicable | Enables reliable tests and audits |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python project tests | $(result "$TEST_RESULT") | Tests and Python compilation | Detects broken security behavior and invalid Python |" >> "$GITHUB_STEP_SUMMARY"
          echo "| JavaScript/TypeScript tests | $(result "$NODE_TEST_RESULT") | npm install/ci, tests, and typecheck when applicable | Detects broken JS/TS behavior |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret detection | $(result "$GITLEAKS_RESULT") | Credentials, tokens, passwords, and secret material | Prevents accidental credential exposure |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Semgrep SAST | $(result "$SEMGREP_RESULT") | Security rules and SecurePR high-confidence rules | Finds unsafe source patterns |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency audit | $(result "$DEPENDENCY_RESULT") | Known Python/npm dependency vulnerabilities | Reduces third-party supply-chain risk |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | $(result "$CODEQL_ANALYZE_RESULT") | Semantic security analysis for applicable languages | Finds deeper data-flow vulnerabilities |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security finding evidence | $(result "$FINDING_SUMMARY_RESULT") | Consolidated SARIF findings | Provides one meaningful finding view |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OWASP Top 10:2025 coverage | $(result "$FINDING_SUMMARY_RESULT") | Coverage mapping for all ten OWASP categories | Shows automated coverage without claiming full category assurance |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Accuracy status | $(result "$ACCURACY_RESULT") | Labeled TP/FP/TN/FN measurement | Prevents unsupported accuracy claims |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Fixes to make this PASS" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$overall" == "PASS" ]]; then
            echo "**No blocking fixes are required for this run.** All applicable controls passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Review every row marked BLOCK and its native Actions output. Remediate the underlying issue on this same PR/branch, then rerun SecurePR." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Remediation" >> "$GITHUB_STEP_SUMMARY"
          echo "SecurePR never auto-edits source, rotates credentials, or merges automatically. Human review remains required." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Accuracy" >> "$GITHUB_STEP_SUMMARY"
          echo "TP = expected BLOCK + actual BLOCK; FP = expected PASS + actual BLOCK; TN = expected PASS + actual PASS; FN = expected BLOCK + actual PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "Precision = TP / (TP + FP). Recall = TP / (TP + FN). F1 = 2 × Precision × Recall / (Precision + Recall)." >> "$GITHUB_STEP_SUMMARY"
          echo "Until labeled benchmark cases exist, SecurePR reports benchmark pending rather than inventing an accuracy percentage." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Human review" >> "$GITHUB_STEP_SUMMARY"
          echo "Human review is always recommended. A PASS is not proof that the repository is vulnerability-free." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the full Actions run]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$overall" != "PASS" ]]; then exit 1; fi

      - name: Preserve SecurePR evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: securepr-evidence
          path: |
            securepr-findings.md
            securepr-accuracy.md
            semgrep-results.sarif
            codeql-results
          if-no-files-found: ignore
