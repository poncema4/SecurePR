name: SecurePR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python source
        run: python -m compileall -q app tests

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep security rules
        run: semgrep scan --config p/python --config p/security-audit --error --exclude tests

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  gate:
    name: Security Gate
    if: ${{ always() }}
    needs:
      - tests
      - gitleaks
      - semgrep
      - dependency-audit
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required security checks
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          echo "Security Tests: ${TESTS_RESULT}"
          echo "Secret Detection: ${GITLEAKS_RESULT}"
          echo "Semgrep SAST: ${SEMGREP_RESULT}"
          echo "Dependency Audit: ${DEPENDENCY_RESULT}"
          echo "CodeQL: ${CODEQL_RESULT}"

          if [[ "${TESTS_RESULT}" != "success" ||
                "${GITLEAKS_RESULT}" != "success" ||
                "${SEMGREP_RESULT}" != "success" ||
                "${DEPENDENCY_RESULT}" != "success" ||
                "${CODEQL_RESULT}" != "success" ]]; then
            echo "Security Gate: BLOCK"
            exit 1
          fi

          echo "Security Gate: PASS"
